<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<title>Уожан — Поселение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --milk: #f5f0e8;
  --milk-light: #faf7f2;
  --white: #ffffff;
  --emerald: #1a6b4a;
  --emerald-dark: #134f37;
  --emerald-light: #e8f5ee;
  --text: #2c2418;
  --text-dim: #7a7062;
  --border: #e5dfd4;
  --font-display: 'Source Serif 4', Georgia, serif;
  --font-body: 'DM Sans', -apple-system, sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  color: var(--text);
  background: var(--milk-light);
  overflow-x: hidden;
}

/* ═══ PASSWORD SCREEN ═══ */
@keyframes pwFadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

#password-screen {
  position: fixed; inset: 0; z-index: 9999;
  background: #060f0a;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 2rem;
  transition: opacity 0.7s ease, transform 0.7s ease;
}
#password-screen.hidden {
  opacity: 0; pointer-events: none; transform: scale(1.04);
}

#password-screen h1 {
  font-family: var(--font-display);
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 300;
  color: var(--emerald);
  letter-spacing: -0.02em;
  opacity: 0;
  animation: pwFadeUp 0.9s ease 0.35s forwards;
}

.pw-input-wrap {
  display: flex; flex-direction: column;
  align-items: center; gap: 1.2rem;
  opacity: 0;
  animation: pwFadeUp 0.9s ease 1s forwards;
}

.pw-input-wrap input {
  padding: 0.8rem 1.4rem;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: 10px;
  font-size: 1rem;
  font-family: var(--font-body);
  color: rgba(255,255,255,0.88);
  outline: none;
  width: 280px;
  letter-spacing: 0.08em;
  transition: border-color 0.3s;
  caret-color: var(--emerald);
}
.pw-input-wrap input::placeholder {
  color: rgba(255,255,255,0.25);
  letter-spacing: 0.02em;
}
.pw-input-wrap input:focus {
  border-color: rgba(255,255,255,0.45);
}

.pw-btn {
  padding: 0.7rem 2.2rem;
  background: transparent;
  color: #fff;
  border: 1px solid var(--emerald);
  border-radius: 10px;
  font-size: 1rem; font-weight: 600;
  font-family: var(--font-body);
  cursor: pointer;
  letter-spacing: 0.06em;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease, background 0.25s, transform 0.2s;
}
.pw-btn.show {
  opacity: 1;
  pointer-events: auto;
}
.pw-btn:hover {
  background: rgba(26,107,74,0.25);
  transform: translateY(-1px);
}

.pw-error {
  color: rgba(220,80,70,0.9);
  font-size: 0.85rem;
  height: 1.2rem;
  letter-spacing: 0.01em;
}

/* ═══ SITE WRAPPER ═══ */
#site { display: none; }
#site.visible { display: block; }

/* ═══ PARALLAX HERO ═══ */
.hero {
  position: relative;
  height: 100vh; min-height: 600px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  background: var(--milk);
}
.hero-bg {
  position: absolute; inset: 0;
  background-image: url('images/cover/Gemini_Generated_Image_c2vw58c2vw58c2vw.png');
  background-size: cover;
  background-position: center;
  will-change: transform;
}
.hero-bg::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(10,30,20,0.45) 0%,
    rgba(10,30,20,0.25) 50%,
    rgba(10,30,20,0.55) 100%
  );
}
/* SVG noise texture */
.hero-noise {
  position: absolute; inset: 0;
  opacity: 0.35;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  background-size: 256px;
}
.hero-content {
  position: relative; z-index: 2;
  text-align: center;
  padding: 2rem;
}
.hero-content h1 {
  font-family: var(--font-display);
  font-size: clamp(4.5rem, 12vw, 9rem);
  font-weight: 300;
  color: #ffffff;
  letter-spacing: -0.03em;
  line-height: 1.05;
  margin-bottom: 1rem;
  text-shadow: 0 2px 24px rgba(0,0,0,0.25);
}
.hero-content .subtitle {
  font-size: clamp(1.05rem, 2.5vw, 1.45rem);
  color: rgba(255,255,255,0.88);
  font-weight: 400;
  max-width: 560px;
  margin: 0 auto 2.5rem;
  line-height: 1.6;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.hero-cta {
  display: inline-block;
  padding: 0.9rem 2.2rem;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.5);
  color: #fff;
  text-decoration: none;
  border-radius: 8px;
  font-weight: 600;
  font-size: 1rem;
  letter-spacing: 0.04em;
  transition: background 0.3s, transform 0.2s;
}
.hero-cta:hover { background: rgba(255,255,255,0.28); transform: translateY(-1px); }

.hero-scroll-hint {
  position: absolute; bottom: 2.5rem; left: 50%;
  transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center;
  color: rgba(255,255,255,0.6); font-size: 0.8rem;
  animation: float 2.5s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(8px); }
}

/* ═══ SECTION TITLES ═══ */
.section-title {
  font-family: var(--font-display);
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 600;
  color: var(--emerald-dark);
  text-align: center;
  margin-bottom: 1rem;
  letter-spacing: -0.02em;
}
.section-subtitle {
  text-align: center;
  color: var(--text-dim);
  font-size: 1.05rem;
  max-width: 600px;
  margin: 0 auto 3.5rem;
  line-height: 1.6;
}

/* ═══ DOMAIN VIEWER ═══ */
#domains {
  padding: 5rem 0 6rem;
}
#domains > .section-title,
#domains > .section-subtitle {
  padding: 0 2rem;
  max-width: 1200px;
  margin-left: auto;
  margin-right: auto;
}

.domain-selector-wrap {
  max-width: 1200px;
  margin: 0 auto 3rem;
  padding: 0 2rem;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.domain-selector {
  display: flex;
  gap: 0.6rem;
  flex-wrap: wrap;
}
.domain-btn {
  padding: 0.55rem 1.3rem;
  background: rgba(26,107,74,0.07);
  border: 1px solid rgba(26,107,74,0.25);
  color: var(--emerald-dark);
  border-radius: 8px;
  font-family: var(--font-body);
  font-size: 0.88rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  letter-spacing: 0.01em;
}
.domain-btn:hover {
  background: rgba(26,107,74,0.14);
  border-color: var(--emerald);
}
.domain-btn.active {
  background: var(--emerald);
  border-color: var(--emerald);
  color: #fff;
}

.domain-view {
  display: grid;
  grid-template-columns: 1fr 1fr;
  max-width: 1400px;
  margin: 0 auto;
  min-height: 520px;
  align-items: center;
}

.dv-img-wrap {
  position: relative;
  padding: 2rem 1.5rem 2rem 2rem;
}
.dv-img-wrap img {
  width: 100%;
  height: 460px;
  object-fit: cover;
  border-radius: 16px;
  display: block;
  transition: opacity 0.3s;
}
.img-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: rgba(255,255,255,0.65);
  cursor: pointer;
  transition: color 0.2s, transform 0.2s;
  z-index: 2;
  padding: 0.5rem;
  display: flex; align-items: center; justify-content: center;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.45));
}
.img-arrow:hover {
  color: rgba(255,255,255,1);
  transform: translateY(-50%) scale(1.18);
  filter: drop-shadow(0 2px 14px rgba(0,0,0,0.6));
}
.img-prev { left: 2rem; }
.img-next { right: 1.5rem; }

.img-dots {
  position: absolute;
  bottom: 3.2rem;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 7px;
  align-items: center;
}
.img-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: rgba(255,255,255,0.45);
  border: 1.5px solid rgba(255,255,255,0.85);
  cursor: pointer;
  transition: all 0.2s;
}
.img-dot.active {
  background: #fff;
  transform: scale(1.35);
}

.dv-text {
  padding: 2rem 2.5rem 2rem 3rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.dv-icon {
  font-size: 1.4rem;
  color: var(--emerald);
  margin-bottom: 0.75rem;
  opacity: 0.65;
}
.dv-text h3 {
  font-family: var(--font-display);
  font-size: clamp(2rem, 3vw, 3rem);
  font-weight: 300;
  color: var(--emerald-dark);
  margin-bottom: 1.5rem;
  letter-spacing: -0.03em;
  line-height: 1.1;
}
.dv-text p {
  color: var(--text-dim);
  font-size: 0.95rem;
  line-height: 1.85;
  margin-bottom: 0.75rem;
}

/* ═══ MODEL SECTION ═══ */
#model-section {
  padding: 4rem 2rem 6rem;
  background: var(--milk);
}
#model-section .section-title { margin-bottom: 0.5rem; }
#model-iframe-wrap {
  max-width: 1200px;
  margin: 0 auto;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
}
#model-iframe-wrap iframe {
  width: 100%;
  height: 900px;
  border: none;
  display: block;
}

/* ═══ FOOTER ═══ */
footer {
  position: relative;
  overflow: hidden;
  height: 260px;
  display: flex; align-items: center; justify-content: center;
}
.footer-bg {
  position: absolute;
  inset: -60px 0;
  background-image: url('images/cover/Gemini_Generated_Image_c2vw58c2vw58c2vw.png');
  background-size: cover;
  background-position: center 30%;
  will-change: transform;
}
.footer-bg::after {
  content: '';
  position: absolute; inset: 0;
  background: rgba(8,25,16,0.62);
}
.footer-content {
  position: relative; z-index: 2;
  text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 0.4rem;
}
.footer-content .footer-title {
  font-family: var(--font-display);
  font-size: clamp(1.6rem, 3.5vw, 2.4rem);
  font-weight: 300;
  color: rgba(255,255,255,0.92);
  letter-spacing: -0.02em;
}
.footer-content .footer-sub {
  font-size: 0.8rem;
  color: rgba(255,255,255,0.45);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

/* ═══ RESPONSIVE ═══ */
@media (max-width: 768px) {
  .domain-view {
    grid-template-columns: 1fr;
  }
  .dv-img-wrap { padding: 1.5rem 1.5rem 1rem; }
  .dv-img-wrap img { height: 260px; }
  .dv-text { padding: 1rem 1.5rem 2rem; }
  .img-prev { left: 2rem; }
  .img-next { right: 1.5rem; }
}
</style>
</head>
<body>

<!-- PASSWORD SCREEN -->
<div id="password-screen">
  <h1>Вы в Уожан?</h1>
  <div class="pw-input-wrap">
    <input type="password" id="pw-input" placeholder="пароль" autocomplete="off">
    <button class="pw-btn" id="pw-btn" onclick="checkPassword()">Да!</button>
    <div class="pw-error" id="pw-error"></div>
  </div>
</div>

<!-- MAIN SITE -->
<div id="site">

  <!-- HERO -->
  <section class="hero">
    <div class="hero-bg" id="hero-bg"></div>
    <div class="hero-noise"></div>
    <div class="hero-content">
      <h1>Уожан</h1>
      <p class="subtitle">Автономное поселение</p>
      <a href="#domains" class="hero-cta">Поселиться</a>
    </div>
    <div class="hero-scroll-hint">
      <span>↓</span>
    </div>
  </section>

  <!-- INTERACTIVE MODEL -->
  <section id="model-section">
    <h2 class="section-title">Финансовая и организационная модель</h2>
    <p class="section-subtitle">Интерактивная модель поселения — настраивайте параметры и анализируйте экономику каждого домена</p>
    <div id="model-iframe-wrap">
      <iframe src="https://uozhan-model.vercel.app/" title="Финансовая модель Уожан" loading="lazy"></iframe>
    </div>
  </section>

  <!-- DOMAINS -->
  <section id="domains">

    <div class="domain-selector-wrap">
      <div class="domain-selector">
        <button class="domain-btn active" data-key="farm">Ферма</button>
        <button class="domain-btn" data-key="selo">Село</button>
        <button class="domain-btn" data-key="sanatorium">Санаторий</button>
        <button class="domain-btn" data-key="villas">Виллы</button>
        <button class="domain-btn" data-key="engineering">Инженерия</button>
        <button class="domain-btn" data-key="security">СБ</button>
        <button class="domain-btn" data-key="earth">Земля</button>
      </div>
    </div>

    <div class="domain-view">
      <div class="dv-img-wrap">
        <img id="dv-img" src="" alt="">
        <button class="img-arrow img-prev" id="img-prev">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="img-arrow img-next" id="img-next">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <div class="img-dots" id="img-dots"></div>
      </div>
      <div class="dv-text">
        <div class="dv-icon" id="dv-icon"></div>
        <h3 id="dv-title"></h3>
        <div id="dv-desc"></div>
      </div>
    </div>

  </section>

  <footer>
    <div class="footer-bg" id="footer-bg"></div>
    <div class="footer-content">
      <span class="footer-title">Уожан 2030</span>
      <span class="footer-sub">© Caput Mundi</span>
    </div>
  </footer>

</div>

<!-- SCRIPTS -->
<script>
// ══ PASSWORD ══
const CORRECT_HASH = 'caput_mundi';

function checkPassword() {
  const input = document.getElementById('pw-input').value;
  if (input === CORRECT_HASH) {
    document.getElementById('password-screen').classList.add('hidden');
    document.getElementById('site').classList.add('visible');
    sessionStorage.setItem('auth', '1');
    setTimeout(() => {
      document.getElementById('password-screen').style.display = 'none';
    }, 700);
  } else {
    document.getElementById('pw-error').textContent = 'Неверный пароль';
    document.getElementById('pw-input').value = '';
  }
}

const pwInput = document.getElementById('pw-input');
const pwBtn   = document.getElementById('pw-btn');
const PW_LEN  = CORRECT_HASH.length;

pwInput.addEventListener('input', () => {
  pwBtn.classList.toggle('show', pwInput.value.length === PW_LEN);
  document.getElementById('pw-error').textContent = '';
});
pwInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && pwInput.value.length === PW_LEN) checkPassword();
});

// Auto-auth for session
if (sessionStorage.getItem('auth') === '1') {
  document.getElementById('password-screen').style.display = 'none';
  document.getElementById('site').classList.add('visible');
}

// ══ PARALLAX ══
window.addEventListener('scroll', () => {
  const scrollY = window.scrollY;
  const bg = document.getElementById('hero-bg');
  if (bg) bg.style.transform = `translateY(${scrollY * 0.4}px)`;

  const footerBg = document.getElementById('footer-bg');
  if (footerBg) {
    const rect = footerBg.parentElement.getBoundingClientRect();
    const offset = (rect.top - window.innerHeight * 0.5) * 0.18;
    footerBg.style.transform = `translateY(${offset}px)`;
  }
});

// ══ DOMAIN VIEWER ══
const DOMAINS = {
  farm: {
    title: 'Ферма', icon: '◎',
    images: [
      'images/farm/Gemini_Generated_Image_6crshw6crshw6crs%20(1).png',
      'images/farm/Gemini_Generated_Image_9003759003759003.png',
      'images/farm/Gemini_Generated_Image_b34mhmb34mhmb34m.png',
      'images/farm/Gemini_Generated_Image_igds5migds5migds.png',
      'images/farm/Gemini_Generated_Image_igs4mzigs4mzigs4.png',
    ],
    html: '<p>Описание в подготовке.</p>'
  },
  selo: {
    title: 'Село', icon: '●',
    images: [
      'images/vilage/Gemini_Generated_Image_aiqhgnaiqhgnaiqh.png',
      'images/vilage/Gemini_Generated_Image_g4sujeg4sujeg4su.png',
      'images/vilage/Gemini_Generated_Image_i0tmdzi0tmdzi0tm.png',
      'images/vilage/Gemini_Generated_Image_nvhxu0nvhxu0nvhx.png',
      'images/vilage/Gemini_Generated_Image_nvr240nvr240nvr2.png',
    ],
    html: '<p>Описание в подготовке.</p>'
  },
  sanatorium: {
    title: 'Санаторий', icon: '◈',
    images: [
      'images/sanatorium/Gemini_Generated_Image_8mx0i38mx0i38mx0.png',
      'images/sanatorium/Gemini_Generated_Image_9egam59egam59ega.png',
      'images/sanatorium/Gemini_Generated_Image_a4wdjua4wdjua4wd.png',
      'images/sanatorium/Gemini_Generated_Image_l3oqxwl3oqxwl3oq.png',
      'images/sanatorium/Gemini_Generated_Image_m0j79em0j79em0j7.png',
    ],
    html: '<p>Описание в подготовке.</p>'
  },
  villas: {
    title: 'Виллы', icon: '⬡',
    images: [
      'images/villa/Gemini_Generated_Image_3uka7y3uka7y3uka.png',
      'images/villa/Gemini_Generated_Image_eax791eax791eax7%20(1).png',
    ],
    html: '<p>Описание в подготовке.</p>'
  },
  engineering: {
    title: 'Инженерия', icon: '▲',
    images: [
      'images/art/Gemini_Generated_Image_c2vw58c2vw58c2vw.png',
      'images/art/Gemini_Generated_Image_hoqi9yhoqi9yhoqi.png',
      'images/art/Gemini_Generated_Image_pmzuympmzuympmzu.png',
      'images/art/Gemini_Generated_Image_t86vi2t86vi2t86v.png',
    ],
    html: '<p>Описание в подготовке.</p>'
  },
  security: {
    title: 'СБ', icon: '▣',
    images: [
      'images/service/Gemini_Generated_Image_b9a3inb9a3inb9a3%20(1).png',
      'images/service/Gemini_Generated_Image_iek95kiek95kiek9.png',
      'images/service/Gemini_Generated_Image_khu1nikhu1nikhu1.png',
      'images/service/Gemini_Generated_Image_ujnrnsujnrnsujnr.png',
    ],
    html: '<p>Описание в подготовке.</p>'
  },
  earth: {
    title: 'Земля', icon: '⬡',
    images: [
      'images/location/Gemini_Generated_Image_lawtxvlawtxvlawt.png',
      'images/location/Gemini_Generated_Image_nob5p0nob5p0nob5.png',
      'images/location/Gemini_Generated_Image_nw00hdnw00hdnw00.png',
      'images/location/Gemini_Generated_Image_rf8pzprf8pzprf8p.png',
      'images/location/Gemini_Generated_Image_xwfii8xwfii8xwfi.png',
    ],
    html: '<p>Описание в подготовке.</p>'
  }
};

let currentDomain = 'earth';
let currentImgIdx = 0;

function renderDomain(key) {
  const d = DOMAINS[key];
  currentDomain = key;
  currentImgIdx = 0;
  document.getElementById('dv-icon').textContent = d.icon;
  document.getElementById('dv-title').textContent = d.title;
  document.getElementById('dv-desc').innerHTML = d.html;
  updateDvImage();
  renderDvDots();
  document.querySelectorAll('.domain-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.key === key);
  });
}

function updateDvImage() {
  const d = DOMAINS[currentDomain];
  const img = document.getElementById('dv-img');
  img.style.transition = 'opacity 0.35s ease';
  img.style.opacity = '0';
  setTimeout(() => {
    img.src = d.images[currentImgIdx];
    img.alt = d.title;
    img.onload = () => { img.style.opacity = '1'; };
    // fallback if already cached
    if (img.complete) img.style.opacity = '1';
  }, 200);
  document.querySelectorAll('.img-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === currentImgIdx);
  });
  const many = d.images.length > 1;
  document.getElementById('img-prev').style.display = many ? 'flex' : 'none';
  document.getElementById('img-next').style.display = many ? 'flex' : 'none';
}

function renderDvDots() {
  const d = DOMAINS[currentDomain];
  const el = document.getElementById('img-dots');
  el.innerHTML = d.images.map((_, i) =>
    `<span class="img-dot${i === 0 ? ' active' : ''}" data-i="${i}"></span>`
  ).join('');
  el.querySelectorAll('.img-dot').forEach(dot => {
    dot.addEventListener('click', () => {
      currentImgIdx = +dot.dataset.i;
      updateDvImage();
    });
  });
}

document.getElementById('img-prev').addEventListener('click', () => {
  const len = DOMAINS[currentDomain].images.length;
  currentImgIdx = (currentImgIdx - 1 + len) % len;
  updateDvImage();
});
document.getElementById('img-next').addEventListener('click', () => {
  const len = DOMAINS[currentDomain].images.length;
  currentImgIdx = (currentImgIdx + 1) % len;
  updateDvImage();
});
document.querySelectorAll('.domain-btn').forEach(btn => {
  btn.addEventListener('click', () => renderDomain(btn.dataset.key));
});

renderDomain('farm');
</script>
